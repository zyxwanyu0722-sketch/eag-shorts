<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scholar Reading</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background: #000;
    overflow: hidden;
    height: 100vh;
    font-family: system-ui, sans-serif;
  }
  .menu{
    position:fixed;
    z-index:12;
    top:16px;
    left:50%;
    transform: translateX(-50%);
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .menu button{
    padding:6px 12px;
    border:1px solid #00ff88;
    background:rgba(0,0,0,0.65);
    color:#00ff88;
    border-radius:6px;
    font-size:14px;
  }
  .menu button.active{
    background:#00ff88;
    color:#000;
  }
  .article-box{
    position:fixed;
    z-index:10;
    top:72px;
    left:50%;
    transform:translateX(-50%);
    width:92%;
    max-width:720px;
    max-height:calc(100vh - 110px);
    overflow-y:auto;
    padding:22px;
    background:rgba(0,0,0,0.74);
    border:1px solid #00ff88;
    border-radius:10px;
    color:#eee;
    line-height:1.7;
    font-size:16px;
  }
  .article-box h2{
    color:#00ff88;
    margin-bottom:14px;
    font-size:20px;
  }
  .article-box p{
    margin-bottom:12px;
  }
  #tip {
    position: fixed;
    bottom:14px;
    left: 0;
    right: 0;
    text-align: center;
    color: #00ff88;
    font-size:13px;
    z-index: 10;
    pointer-events: none;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1;
  }
</style>
</head>
<body>
<div class="menu">
  <button onclick="showArticle(0)" class="active">Supersymmetry</button>
  <button onclick="showArticle(1)">Gravitational Waves</button>
  <button onclick="showArticle(2)">Top Quark</button>
</div>
<div class="article-box" id="art">
</div>
<div id="tip">Click anywhere, the bug crawls there</div>
<canvas id="game"></canvas>

<script>
const articles = [
`
<h2>Supersymmetry and the LHC Run 2</h2>
<p>The idea of exploiting potential symmetries of a physical system to impose constraints on the system's Lagrangian, and therefore on the equations of motion, has been a very fertile one. It has been used successfully in virtually all branches of physics, from classical mechanics to contemporary applications to physical modelling in all disciplines.</p>
<p>Supersymmetry (SUSY) is an additional space-time symmetry of nature. In fact, it is the only way to extend space-time symmetries to internal symmetries. If SUSY is a good symmetry for a physical system, then the system is invariant for an operator that transforms all bosons into fermions and vice versa.</p>
<p>In a model with exact supersymmetry, superpartners share identical quantum numbers and masses. Since we have not found such particles at 511 keV, supersymmetry must be spontaneously broken.</p>
<p>SUSY solves the hierarchy problem and offers a candidate for cold dark matter. The LHC Run 2 experiments performed extensive searches for supersymmetric particles, and so far no clear excess has been observed.</p>
`,
`
<h2>Gravitational Waves: Ground-Based Interferometric Detectors</h2>
<p>One century after their prediction by Albert Einstein, gravitational waves, produced from binary black hole mergers, were finally directly detected in 2015 by LIGO detectors.</p>
<p>Gravitational waves are ripples in spacetime, travelling at the speed of light. They stretch and compress space as they pass through detectors.</p>
<p>Ground-based laser interferometers like LIGO, Virgo and KAGRA measure tiny length changes, far smaller than the diameter of a proton.</p>
<p>These detectors open a completely new window to observe the universe, allowing us to study black holes and neutron stars without light.</p>
`,
`
<h2>The Top Quark Discovery</h2>
<p>The top quark, the heaviest elementary particle known to date, was discovered by the CDF and D0 collaborations in 1995 at Fermilab.</p>
<p>Its huge mass makes it unique. The top quark decays before it can hadronise, so we can directly observe its bare quark properties.</p>
<p>The top quark plays an important role in testing the Standard Model and exploring possible new physics beyond it. Its Yukawa coupling to the Higgs boson is nearly unity, a special feature still not fully understood.</p>
`
];
function showArticle(idx){
  document.getElementById("art").innerHTML = articles[idx];
  document.querySelectorAll(".menu button").forEach((b,i)=>{
    b.classList.toggle("active", i===idx);
  })
}
showArticle(0);

// 虫子动画
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const bug = {
  x: 0,
  y: 0,
  targetX: 0,
  targetY: 0,
  angle: 0,
  speed: 3.5,
  turnSpeed: 0.08,
  legPhase: 0,
  size: 14
};
bug.x = W / 2;
bug.y = H / 2;
bug.targetX = bug.x;
bug.targetY = bug.y;

window.addEventListener("click", (e) => {
  bug.targetX = e.clientX;
  bug.targetY = e.clientY;
});
window.addEventListener("touchstart", (e) => {
  const t = e.touches[0];
  bug.targetX = t.clientX;
  bug.targetY = t.clientY;
}, { passive: true });

function drawBug() {
  const dx = bug.targetX - bug.x;
  const dy = bug.targetY - bug.y;
  const dist = Math.hypot(dx, dy);
  if (dist > 1) {
    const targetAngle = Math.atan2(dy, dx);
    let diff = targetAngle - bug.angle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    bug.angle += diff * bug.turnSpeed;
  }
  if (dist > 2) {
    bug.x += Math.cos(bug.angle) * bug.speed;
    bug.y += Math.sin(bug.angle) * bug.speed;
    bug.legPhase += 0.35;
  }
  ctx.save();
  ctx.translate(bug.x, bug.y);
  ctx.rotate(bug.angle);
  const s = bug.size;
  for (let i = 4; i >= 0; i--) {
    ctx.beginPath();
    ctx.arc(-i * s * 0.55, 0, s * (0.45 - i * 0.04), 0, Math.PI * 2);
    ctx.fillStyle = i === 0 ? "#ff3b3b" : "#111";
    ctx.fill();
    ctx.strokeStyle = "#0f0";
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  const legCount = 6;
  for (let i = 0; i < legCount; i++) {
    const segX = -i * s * 0.55 + s * 0.4;
    const swing = Math.sin(bug.legPhase + i * 1.1) * 4;
    ctx.beginPath();
    ctx.moveTo(segX, s * 0.25);
    ctx.lineTo(segX + 6, s * 0.9 + swing);
    ctx.strokeStyle = "#0f0";
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(segX, -s * 0.25);
    ctx.lineTo(segX + 6, -s * 0.9 - swing);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(s * 0.5, s * 0.15);
  ctx.lineTo(s * 1.1, s * 0.5);
  ctx.moveTo(s * 0.5, -s * 0.15);
  ctx.lineTo(s * 1.1, -s * 0.5);
  ctx.strokeStyle = "#0f0";
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();
  ctx.beginPath();
  ctx.arc(bug.targetX, bug.targetY, 6, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(0, 255, 136, 0.8)";
  ctx.lineWidth = 1.5;
  ctx.stroke();
}
function loop() {
  ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
  ctx.fillRect(0, 0, W, H);
  drawBug();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
