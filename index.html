<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>虫子跟随点击</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #000;
    overflow: hidden;
    height: 100vh;
    font-family: "Microsoft Yahei", sans-serif;
  }

  #tip {
    position: fixed;
    top: 12px;
    left: 0;
    right: 0;
    text-align: center;
    color: #00ff88;
    font-size: 14px;
    z-index: 10;
    letter-spacing: 2px;
    pointer-events: none;
  }

  canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1;
  }
</style>
</head>
<body>

<div id="tip">点击屏幕任意位置，虫子会爬向那里</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// 虫子本体
const bug = {
  x: 0,
  y: 0,
  targetX: 0,
  targetY: 0,
  angle: 0,
  speed: 3.5,        // 移动速度
  turnSpeed: 0.08,   // 转向速度
  legPhase: 0,
  size: 14
};

// 初始位置放中间
bug.x = W / 2;
bug.y = H / 2;
bug.targetX = bug.x;
bug.targetY = bug.y;

// 点击设置目标点
window.addEventListener("click", (e) => {
  bug.targetX = e.clientX;
  bug.targetY = e.clientY;
});

window.addEventListener("touchstart", (e) => {
  const t = e.touches[0];
  bug.targetX = t.clientX;
  bug.targetY = t.clientY;
}, { passive: true });

// 画虫子：黑色身体 + 红色头 + 多足
function drawBug() {
  const dx = bug.targetX - bug.x;
  const dy = bug.targetY - bug.y;
  const dist = Math.hypot(dx, dy);

  // 朝向目标点
  if (dist > 1) {
    const targetAngle = Math.atan2(dy, dx);
    let diff = targetAngle - bug.angle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    bug.angle += diff * bug.turnSpeed;
  }

  // 向目标移动
  if (dist > 2) {
    bug.x += Math.cos(bug.angle) * bug.speed;
    bug.y += Math.sin(bug.angle) * bug.speed;
    bug.legPhase += 0.35;
  }

  ctx.save();
  ctx.translate(bug.x, bug.y);
  ctx.rotate(bug.angle);

  const s = bug.size;

  // 身体分节
  for (let i = 4; i >= 0; i--) {
    ctx.beginPath();
    ctx.arc(-i * s * 0.55, 0, s * (0.45 - i * 0.04), 0, Math.PI * 2);
    ctx.fillStyle = i === 0 ? "#ff3b3b" : "#111";
    ctx.fill();
    ctx.strokeStyle = "#0f0";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // 腿
  const legCount = 6;
  for (let i = 0; i < legCount; i++) {
    const segX = -i * s * 0.55 + s * 0.4;
    const swing = Math.sin(bug.legPhase + i * 1.1) * 4;

    ctx.beginPath();
    ctx.moveTo(segX, s * 0.25);
    ctx.lineTo(segX + 6, s * 0.9 + swing);
    ctx.strokeStyle = "#0f0";
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(segX, -s * 0.25);
    ctx.lineTo(segX + 6, -s * 0.9 - swing);
    ctx.stroke();
  }

  // 触角
  ctx.beginPath();
  ctx.moveTo(s * 0.5, s * 0.15);
  ctx.lineTo(s * 1.1, s * 0.5);
  ctx.moveTo(s * 0.5, -s * 0.15);
  ctx.lineTo(s * 1.1, -s * 0.5);
  ctx.strokeStyle = "#0f0";
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.restore();

  // 目标点标记
  ctx.beginPath();
  ctx.arc(bug.targetX, bug.targetY, 6, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(0, 255, 136, 0.8)";
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function loop() {
  ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
  ctx.fillRect(0, 0, W, H);

  drawBug();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
